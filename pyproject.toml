[project]
name = "redshift-deep-copy-migration"
version = "0.1.0"
description = "Chunked Redshift deep-copy migration using the Data API."
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.40,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "ruff>=0.13,<0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migration"]

[tool.ruff]
extend-exclude = [".tools"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
exclude = ["^\\.tools/"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
